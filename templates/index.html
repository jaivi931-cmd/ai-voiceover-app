<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOXIFYR AI - Next-Gen Video Localization Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(18, 20, 29, 0.7);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f3f4f6;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    .header { margin-bottom: 2rem; text-align: center; }
    .header h1 { font-size: 2.5rem; background: linear-gradient(135deg, #a5b4fc, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
    .header p { color: #9ca3af; margin-top: 0.5rem; }
    .studio-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; width: 100%; max-width: 1200px; }
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(12px); }
    .upload-box { border: 2px dashed var(--accent); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 1.5rem; }
    .upload-box:hover { background: rgba(99, 102, 241, 0.1); }
    textarea, select, button { width: 100%; margin-top: 0.75rem; padding: 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: #181b26; color: var(--text); font-size: 0.95rem; }
    textarea { height: 120px; resize: vertical; }
    button { background: var(--accent); cursor: pointer; font-weight: 600; border: none; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    .video-monitor { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .status-msg { margin-top: 1rem; font-size: 0.9rem; color: #a5b4fc; text-align: center; word-break: break-word; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 0.75rem; background: #181b26; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
    .checkbox-group input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>VOXIFYR AI STUDIO</h1>
    <p>AI-Powered Video Localization & Natural Voiceover Engine</p>
  </div>

  <div class="studio-container">
    <div class="panel">
      <h3>📁 1. Upload Video</h3>
      <div class="upload-box" onclick="document.getElementById('videoInput').click()">
        <p id="uploadText">Click or Drag & Drop MP4 Video File</p>
        <input type="file" id="videoInput" accept="video/mp4,video/*" style="display:none" onchange="loadVideo(event)">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
        <h3>🎙️ 2. Voiceover Script</h3>
        <button onclick="extractAudioScript()" style="width: auto; padding: 0.4rem 0.8rem; margin: 0; font-size: 0.8rem; background: #374151;">Auto-Extract Audio</button>
      </div>
      <textarea id="scriptText" placeholder="Script will extract automatically or enter text manually..."></textarea>

      <h3 style="margin-top: 1rem;">Translate Language</h3>
      <select id="langSelect">
        <option value="English">English (Original / US)</option>
        <option value="Hindi">Hindi (India)</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="German">German</option>
      </select>

      <label class="checkbox-group">
        <input type="checkbox" id="verticalCheck">
        <span style="font-size: 0.9rem; color: var(--text);">📱 Convert to 9:16 Vertical (Shorts / Reels)</span>
      </label>

      <label class="checkbox-group">
        <input type="checkbox" id="subtitleCheck">
        <span style="font-size: 0.9rem; color: var(--text);">💬 Burn-in Subtitles / Captions on Video</span>
      </label>

      <h3 style="margin-top: 1rem;">3. Target Voice & Accent</h3>
      <select id="voiceSelect">
        <option value="pNInz6obpgDQGcFmaJgB">Adam (Male - Deep & Clear)</option>
        <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Female - Calm & Professional)</option>
        <option value="AZnzlk1XvdvUeBnXmlld">Domi (Female - Energetic)</option>
        <option value="ErXwobaYiN019PkySvjV">Antoni (Male - Warm & Friendly)</option>
      </select>

      <button id="renderBtn" style="margin-top: 1.5rem;" onclick="processLocalization()">✨ Render Localized Video</button>
      <div id="status" class="status-msg"></div>
    </div>

    <div class="panel">
      <h3>🖥️ Studio Monitor</h3>
      <div class="video-monitor">
        <video id="mainVideo" controls></video>
      </div>
      <button id="downloadBtn" style="display:none; margin-top:1rem; background:#10b981;" onclick="downloadMergedVideo()">📥 Download Localized MP4 Video</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "";
    let videoFile = null;
    let generatedAudioBlob = null;

    function loadVideo(e) {
      const file = e.target.files[0];
      if (file) {
        videoFile = file;
        document.getElementById('uploadText').innerText = `Selected: ${file.name}`;
        const videoElement = document.getElementById('mainVideo');
        videoElement.src = URL.createObjectURL(file);
      }
    }

    function extractAudioScript() {
      const status = document.getElementById('status');
      status.innerText = "Listening & extracting audio script...";
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition not supported in this browser.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      let fullTranscript = "";

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            fullTranscript += event.results[i][0].transcript + " ";
          }
        }
        document.getElementById('scriptText').value = fullTranscript.trim();
      };

      recognition.onerror = () => { status.innerText = "Extraction complete or paused."; };
      recognition.onend = () => { status.innerText = "Full Script Extracted Successfully!"; };

      const videoElement = document.getElementById('mainVideo');
      videoElement.muted = false;
      videoElement.currentTime = 0;
      videoElement.play();
      recognition.start();

      videoElement.onended = () => { recognition.stop(); };
    }

    async function processLocalization() {
      const text = document.getElementById('scriptText').value.trim();
      const voiceId = document.getElementById('voiceSelect').value;
      const targetLang = document.getElementById('langSelect').value;
      const status = document.getElementById('status');

      if (!videoFile) {
        alert("Please upload a video file first!");
        return;
      }
      if (!text) {
        alert("Please enter or extract script first!");
        return;
      }

      status.innerText = `⏳ Translating script to ${targetLang} & generating AI voiceover...`;

      try {
        const response = await fetch(`${BACKEND_URL}/api/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            text: text, 
            voice_id: voiceId,
            language: targetLang 
          })
        });

        if (!response.ok) throw new Error(await response.text());

        const encodedTranslated = response.headers.get('X-Translated-Text');
        if (encodedTranslated) {
          try {
            const translatedText = decodeURIComponent(encodedTranslated);
            document.getElementById('scriptText').value = translatedText;
          } catch(e) {}
        }

        generatedAudioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(generatedAudioBlob);

        const video = document.getElementById('mainVideo');
        video.muted = true;
        
        const audio = new Audio(audioUrl);
        video.currentTime = 0;
        video.play();
        audio.play();

        status.innerText = `✨ Localized to ${targetLang} successfully! Click 'Download Localized MP4 Video' below.`;
        document.getElementById('downloadBtn').style.display = "block";

      } catch (err) {
        status.innerText = `Error: ${err.message}`;
      }
    }

    async function downloadMergedVideo() {
      const status = document.getElementById('status');
      if (!videoFile || !generatedAudioBlob) {
        alert("Please render the video first!");
        return;
      }

      status.innerText = "⚙️ Merging Video, Vertical Crop & Subtitles on Server... Please wait 5-10 seconds.";

      const isVertical = document.getElementById('verticalCheck').checked;
      const addSubtitles = document.getElementById('subtitleCheck').checked;
      const currentScript = document.getElementById('scriptText').value.trim();

      const formData = new FormData();
      formData.append('video', videoFile);
      formData.append('audio', generatedAudioBlob, 'voiceover.mp3');
      formData.append('vertical', isVertical ? 'true' : 'false');
      formData.append('subtitles', addSubtitles ? 'true' : 'false');
      formData.append('script_text', currentScript);

      try {
        const response = await fetch(`${BACKEND_URL}/api/merge-video`, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error("Merging failed on server.");

        const finalVideoBlob = await response.blob();
        const downloadUrl = URL.createObjectURL(finalVideoBlob);
        
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = "voxifyr_localized_video.mp4";
        a.click();

        status.innerText = "🎉 Video downloaded successfully!";
      } catch (err) {
        status.innerText = `Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
