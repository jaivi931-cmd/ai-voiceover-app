<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Translator Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .studio-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header-title {
            background: linear-gradient(45deg, #007bff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
            max-height: 400px;
        }
        .form-control, .form-select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #333;
            border-color: #007bff;
            color: #fff;
            box-shadow: none;
        }
        .btn-custom {
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,123,255,0.4);
        }
        #loadingSpinner {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="text-center mb-4">
            <h1 class="header-title display-5"><i class="fas fa-photo-video me-2"></i>AI Video Translator & Studio</h1>
            <p class="text-secondary">Translate video audio with perfect lip-sync & voiceover precision</p>
        </div>

        <div class="row g-4">
            <!-- Left Panel: Input & Settings -->
            <div class="col-lg-6">
                <div class="card studio-card p-4 h-100">
                    <h4 class="mb-3"><i class="fas fa-sliders-h me-2 text-primary"></i>Translation Settings</h4>
                    
                    <form id="transForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Upload Video File</label>
                            <input type="file" class="form-control" id="videoFile" name="video" accept="video/*" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Target Language</label>
                                <select class="form-select" id="targetLang" name="target_lang">
                                    <option value="Hindi" selected>Hindi</option>
                                    <option value="English">English</option>
                                    <option value="Spanish">Spanish</option>
                                    <option value="French">French</option>
                                    <option value="German">German</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Voice Model</label>
                                <select class="form-select" id="voiceSelect" name="voice_id">
                                    <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Calm & Natural)</option>
                                    <option value="AZnzlk1XvdvUeBnXmlld">Domi (Energetic)</option>
                                    <option value="EXAVITQu4vr4xnSDxMaL">Bella (Expressive)</option>
                                    <option value="ErXwobaYiN019PkySvjV">Antoni (Smooth & Deep)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0">Extracted / Translated Script</label>
                                <button type="button" class="btn btn-sm btn-outline-info" id="extractBtn">
                                    <i class="fas fa-magic me-1"></i>Auto-Extract
                                </button>
                            </div>
                            <textarea class="form-control" id="scriptBox" name="custom_script" rows="5" placeholder="Script will automatically appear here after processing, or you can type/edit manually..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-custom w-100 mt-2">
                            <i class="fas fa-sync-alt me-2"></i>Process & Translate Video
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Panel: Preview & Output -->
            <div class="col-lg-6">
                <div class="card studio-card p-4 h-100 text-center d-flex flex-column justify-content-between">
                    <div>
                        <h4 class="mb-3 text-start"><i class="fas fa-play-circle me-2 text-primary"></i>Studio Preview</h4>
                        
                        <div id="videoContainer" class="mb-3">
                            <video id="videoPreview" controls>
                                <source src="" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>

                        <div id="loadingSpinner" class="py-4">
                            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                            <p class="mt-3 text-info">Processing audio-video sync & generating voiceover... Please wait.</p>
                        </div>
                    </div>

                    <div class="mt-3">
                        <a id="downloadBtn" href="#" class="btn btn-success w-100 disabled" download>
                            <i class="fas fa-download me-2"></i>Download Translated Video
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('transForm');
        const videoPreview = document.getElementById('videoPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            loadingSpinner.style.display = 'block';
            downloadBtn.classList.add('disabled');

            const formData = new FormData(form);

            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    videoPreview.src = data.video_url;
                    downloadBtn.href = data.video_url;
                    downloadBtn.classList.remove('disabled');
                    if(data.script) {
                        document.getElementById('scriptBox').value = data.script;
                    }
                } else {
                    alert('Error: ' + (data.error || 'Translation failed'));
                }
            } catch (err) {
                alert('An error occurred during translation processing.');
                console.error(err);
            } finally {
                loadingSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
