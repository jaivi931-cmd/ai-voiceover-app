<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOXIFYR AI - Next-Gen AI Video Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #07090e; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; border: 1px solid rgba(56, 189, 248, 0.2); font-weight: 600; margin-bottom: 12px; display: inline-block; }
        h1 { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; text-align: center; }
        p.sub { color: #94a3b8; text-align: center; margin-bottom: 40px; font-size: 1rem; }
        
        .studio-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; width: 100%; max-width: 1100px; }
        @media (max-width: 900px) { .studio-container { grid-template-columns: 1fr; } }
        
        .panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .step-title { color: #38bdf8; font-weight: 700; font-size: 1.05rem; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .upload-box { border: 2px dashed #334155; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: #0b0f19; transition: 0.2s; }
        .upload-box:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.02); }
        .upload-box p { color: #94a3b8; font-size: 0.9rem; margin-top: 8px; }

        label { display: block; font-size: 0.85rem; color: #cbd5e1; font-weight: 600; margin: 18px 0 6px 0; }
        select, textarea { width: 100%; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 0.9rem; outline: none; }
        select:focus, textarea:focus { border-color: #38bdf8; }

        .btn-action { width: 100%; background: linear-gradient(135deg, #0284c7, #4f46e5); color: white; border: none; border-radius: 8px; padding: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); }
        .btn-action:hover { opacity: 0.9; }
        .btn-secondary { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

        video { width: 100%; border-radius: 10px; background: #000; margin-top: 10px; min-height: 250px; }
        .status { margin-top: 15px; text-align: center; font-size: 0.85rem; color: #38bdf8; word-break: break-all; }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <span class="badge">⚡ Next-Gen AI Video Studio</span>
        <h1>VOXIFYR AI</h1>
        <p class="sub">Localize product videos into global accents & languages in seconds.</p>
    </div>

    <div class="studio-container">
        <!-- LEFT CONTROL PANEL -->
        <div class="panel">
            <div class="step-title">
                <span>📁 1. Upload Video</span>
            </div>
            <div class="upload-box" onclick="document.getElementById('vidInput').click()">
                <svg width="36" height="36" fill="none" stroke="#38bdf8" viewBox="0 0 24 24" style="margin:0 auto;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p id="fileLabel">Click to select MP4/MOV Video (Max 50MB)</p>
                <input type="file" id="vidInput" accept="video/*" style="display:none" onchange="handleFile(event)">
            </div>

            <div class="step-title" style="margin-top:24px;">
                <span>🎙️ 2. Voiceover Script</span>
                <button class="btn-secondary" onclick="autoExtract()">⚡ Auto-Extract Audio</button>
            </div>
            <textarea id="scriptText" rows="3" placeholder="I have 9 iPhones for you guys and I am going to giveaway these iPhones..."></textarea>

            <label for="transLang">Translate Language (30+ Global Languages)</label>
            <select id="transLang">
                <option value="en">Translate to English (US/UK)</option>
                <option value="hi">Translate to Hindi (हिंदी)</option>
                <option value="es">Translate to Spanish (Español)</option>
                <option value="fr">Translate to French (Français)</option>
                <option value="de">Translate to German (Deutsch)</option>
                <option value="ja">Translate to Japanese (日本語)</option>
                <option value="ar">Translate to Arabic (العربية)</option>
            </select>

            <label for="voiceSelect">3. Target Voice & Accent</label>
            <select id="voiceSelect">
                <option value="21m00Tcm4TlvDq8ikWAM">American Male (George - Professional)</option>
                <option value="AZnzlk1XvdvUeBnXmlld">American Female (Rachel - Clear)</option>
                <option value="EXAVITQu4vr4xnSDxMaL">British Male (Oliver - Narrative)</option>
            </select>

            <button class="btn-action" onclick="renderVideo()" id="renderBtn">✨ Render Localized Video</button>
            <div class="status" id="statusMsg"></div>
        </div>

        <!-- RIGHT MONITOR PANEL -->
        <div class="panel">
            <div class="step-title">
                <span>🖥️ Studio Monitor</span>
                <span style="color:#22c55e; font-size:0.8rem;">● Live Studio</span>
            </div>
            
            <video id="studioPlayer" controls></video>
            <audio id="localizedAudio" controls style="width:100%; margin-top:15px; display:none;"></audio>
        </div>
    </div>

    <script>
        const BACKUP_KEY = "sk_bb44bca2887236ec7a3b757e43b37ecsb8df1389c758d1dd";

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileLabel').innerText = "Selected: " + file.name;
                const url = URL.createObjectURL(file);
                document.getElementById('studioPlayer').src = url;
            }
        }

        function autoExtract() {
            document.getElementById('scriptText').value = "I have 9 iphones for you guys and I am going to giveaway these iphones.";
        }

        async function renderVideo() {
            let text = document.getElementById('scriptText').value.trim();
            if(!text) {
                text = "I have 9 iphones for you guys and I am going to giveaway these iphones.";
                document.getElementById('scriptText').value = text;
            }

            const voice = document.getElementById('voiceSelect').value;
            const btn = document.getElementById('renderBtn');
            const status = document.getElementById('statusMsg');
            const audio = document.getElementById('localizedAudio');

            btn.disabled = true;
            status.style.color = "#38bdf8";
            status.innerText = "Processing AI voiceover rendering...";

            try {
                // First try via backend
                let res = await fetch('/generate-voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, voice_id: voice })
                });

                if (res.ok) {
                    const blob = await res.blob();
                    audio.src = URL.createObjectURL(blob);
                    audio.style.display = "block";
                    audio.play();
                    status.innerText = "✨ Rendering completed successfully!";
                    btn.disabled = false;
                    return;
                }

                // Direct Fallback to ElevenLabs API if Backend failed
                status.innerText = "Backend busy, generating audio directly...";
                const directRes = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'audio/mpeg',
                        'Content-Type': 'application/json',
                        'xi-api-key': BACKUP_KEY
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: 'eleven_multilingual_v2',
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });

                if (directRes.ok) {
                    const blob = await directRes.blob();
                    audio.src = URL.createObjectURL(blob);
                    audio.style.display = "block";
                    audio.play();
                    status.innerText = "✨ Direct Localized Audio Generated Successfully!";
                } else {
                    const errData = await directRes.json();
                    status.style.color = "#ef4444";
                    status.innerText = "ElevenLabs Error: " + (errData.detail ? errData.detail.message || JSON.stringify(errData.detail) : "API Key Issue");
                }
            } catch (err) {
                status.style.color = "#ef4444";
                status.innerText = "Connection Error: " + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
