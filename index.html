<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOXIFYR - Enterprise AI Voiceover</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #161e2e; border: 1px solid #233044; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; font-size: 1.8rem; text-align: center; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: #94a3b8; text-align: center; font-size: 0.9rem; margin-bottom: 24px; }
        label { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 6px; }
        textarea, select { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 0.95rem; margin-bottom: 18px; outline: none; }
        textarea:focus, select:focus { border-color: #38bdf8; }
        button { width: 100%; background: #0284c7; color: white; border: none; border-radius: 8px; padding: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .status { margin-top: 15px; text-align: center; font-size: 0.85rem; color: #38bdf8; }
        audio { width: 100%; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VOXIFYR AI</h1>
        <p class="subtitle">Next-Gen Voiceover & Localization Engine</p>
        
        <label for="voice">Voice Model</label>
        <select id="voice">
            <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Professional & Clear)</option>
            <option value="AZnzlk1XvdvUeBnXmlld">Domi (Energetic)</option>
            <option value="EXAVITQu4vr4xnSDxMaL">Bella (Soft & Smooth)</option>
        </select>

        <label for="text">Script / Prompt</label>
        <textarea id="text" rows="4" placeholder="Type or paste script here..."></textarea>

        <button onclick="generateAudio()" id="btn">Generate Voiceover</button>
        <div class="status" id="status"></div>
        <audio id="player" controls></audio>
    </div>

    <script>
        async function generateAudio() {
            const text = document.getElementById('text').value;
            const voice_id = document.getElementById('voice').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const player = document.getElementById('player');

            if (!text) { alert('Please enter some text!'); return; }

            btn.disabled = true;
            status.innerText = "Generating high-quality voiceover...";
            player.style.display = "none";

            try {
                const res = await fetch('/generate-voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice_id })
                });

                if (!res.ok) { throw new Error('Generation failed'); }

                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);
                player.src = audioUrl;
                player.style.display = "block";
                player.play();
                status.innerText = "Voiceover ready!";
            } catch (err) {
                status.innerText = "Error generating audio. Check API key.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
